<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forge AI — Dashboard</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0b0b0f; color: #eee; margin: 0; padding: 40px; }
  h1 { font-size: 28px; }
  .card { background: #16161c; border-radius: 12px; padding: 20px; margin-top: 20px; max-width: 480px; }
  .stat { font-size: 32px; font-weight: 700; }
  .label { color: #999; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body>
  <h1>⚡ Forge AI Genius v16.0</h1>
  <div class="card">ffc
    <div class="label">Status</div>
    <div class="stat" id="status">loading…</div>
  </div>
  <div class="card">
    <div class="label">Studios Connected</div>
    <div class="stat" id="studios">–</div>
  </div>
  <div class="card">
    <div class="label">Templates / Knowledge Entries</div>
    <div class="stat" id="counts">–</div>
  </div>
  <script>
    fetch('/api/health').then(r => r.json()).then(d => {
      document.getElementById('status').textContent = d.ok ? 'Online' : 'Offline';
      document.getElementById('studios').textContent = d.studios_connected;
      document.getElementById('counts').textContent = d.templates + ' / ' + d.knowledge_base;
    }).catch(() => {
      document.getElementById('status').textContent = 'Unreachable';
    });
  </script>
</body>
</html>
