<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enes AI</title>
<style>
  :root{
    /* Deep navy/graphite with an electric cyan accent. */
    --iron-black: #070b12;
    --iron-panel: #10161f;
    --iron-panel-light: #182130;
    --iron-line: #263244;
    --ember: #22d3ee;
    --ember-bright: #7ef0ff;
    --slag: #6b7a8f;
    --steel: #c7d2dc;
    --white: #eef6f8;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--iron-black);
    color: var(--steel);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--iron-line);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 8px var(--good);
  }
  .brand .dot.dead { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .brand .name { font-weight: 700; letter-spacing: .02em; color: var(--white); font-size: 15px; }
  .topbar-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--iron-panel-light);
    border: 1px solid var(--iron-line);
    color: var(--steel);
    border-radius: 8px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px;
  }
  .icon-btn:hover { border-color: var(--ember); color: var(--ember-bright); }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .row { display: flex; flex-direction: column; margin: 10px 0; max-width: 100%; }
  .row.user { align-items: flex-end; }
  .row.assistant { align-items: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 11px 16px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--iron-panel-light);
    border: 1px solid var(--iron-line);
    color: var(--white);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: transparent;
    padding: 0;
    color: var(--steel);
    max-width: 100%;
  }
  .bubble code, .bubble pre { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; }
  .bubble pre {
    background: var(--iron-panel);
    border: 1px solid var(--iron-line);
    padding: 12px; border-radius: 10px;
    overflow-x: auto; margin: 8px 0;
  }

  .meta-line {
    display: flex; align-items: center; gap: 10px;
    margin-top: 6px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--slag);
  }
  .meta-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--iron-panel-light);
    border: 1px solid var(--iron-line);
    border-radius: 20px;
    padding: 3px 10px;
  }

  .error-card {
    align-self: stretch;
    background: rgba(248,113,113,.08);
    border: 1px solid rgba(248,113,113,.35);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    color: var(--bad);
    font-size: 13.5px;
    margin: 10px 0;
  }
  .error-card .retry-btn {
    background: rgba(248,113,113,.15);
    border: 1px solid rgba(248,113,113,.4);
    color: var(--bad);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--slag);
    font-size: 14px;
    max-width: 340px;
  }
  .empty-state .name { color: var(--white); font-weight: 700; font-size: 20px; display: block; margin-bottom: 8px; }

  .input-bar {
    flex-shrink: 0;
    border-top: 1px solid var(--iron-line);
    padding: 12px 16px 16px;
    display: flex; justify-content: center;
  }
  .input-shell {
    width: 100%; max-width: 720px;
    background: var(--iron-panel-light);
    border: 1px solid var(--iron-line);
    border-radius: 22px;
    display: flex; align-items: center;
    padding: 6px 6px 6px 16px;
    gap: 8px;
  }
  .input-shell input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--white); font-size: 14.5px; padding: 8px 0;
  }
  .input-shell input::placeholder { color: var(--slag); }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--ember);
    border: none; color: #04141a;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  .send-btn:disabled { background: var(--slag); cursor: wait; }

  .details-panel {
    position: fixed; inset: 0;
    background: rgba(4,8,13,.7);
    display: none;
    align-items: flex-end;
    z-index: 20;
  }
  .details-panel.open { display: flex; }
  .details-sheet {
    background: var(--iron-panel);
    border-top: 1px solid var(--iron-line);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-height: 78vh;
    overflow-y: auto;
    padding: 20px 20px 30px;
  }
  .details-sheet h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--white); margin: 18px 0 8px;
  }
  .details-sheet h3:first-child { margin-top: 0; }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--iron-line); }
  .stat-row .label { color: var(--slag); }
  .stat-row .value { color: var(--white); font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .name-chip {
    display: inline-block; font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; padding: 4px 9px; border-radius: 5px;
    background: var(--iron-panel-light); border: 1px solid var(--iron-line);
    margin: 3px; color: var(--steel);
  }
  .close-sheet {
    background: var(--iron-panel-light); border: 1px solid var(--iron-line); color: var(--white);
    border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; margin-top: 16px; width: 100%;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--iron-line); border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="dot dead" id="statusDot"></div>
    <span class="name">Enes AI</span>
  </div>
  <div class="topbar-actions">
    <div class="icon-btn" onclick="clearChat()" title="Clear chat">&#8635;</div>
    <div class="icon-btn" onclick="openDetails()" title="Status &amp; recognized names">&#9881;</div>
  </div>
</div>

<div class="chat-scroll" id="chatScroll">
  <div class="empty-state" id="emptyState">
    <span class="name">Enes AI</span>
    Ask for a system, a Lua concept, or describe something custom - e.g. "admin system", "how do coroutines work", "build a castle".
  </div>
</div>

<div class="input-bar">
  <div class="input-shell">
    <input id="chatInput" type="text" placeholder="Type a message&#8230;" onkeydown="if(event.key==='Enter')sendChat()" />
    <button class="send-btn" id="sendBtn" onclick="sendChat()">&#8593;</button>
  </div>
</div>

<div class="details-panel" id="detailsPanel" onclick="if(event.target===this)closeDetails()">
  <div class="details-sheet">
    <h3>Status</h3>
    <div class="stat-row"><span class="label">Server</span><span class="value" id="statServer">checking&#8230;</span></div>
    <div class="stat-row"><span class="label">Studios Connected</span><span class="value" id="statStudios">&ndash;</span></div>
    <div class="stat-row"><span class="label">Recognized Names</span><span class="value" id="statTemplates">&ndash;</span></div>
    <div class="stat-row"><span class="label">Knowledge Entries</span><span class="value" id="statKnowledge">&ndash;</span></div>
    <div class="stat-row"><span class="label">Local Model</span><span class="value" id="statLocalModel">&ndash;</span></div>

    <h3>Recognized Names</h3>
    <div id="templateChips">loading&#8230;</div>

    <button class="close-sheet" onclick="closeDetails()">Close</button>
  </div>
</div>

<script>
// Points at the phone's local Forge/Enes AI server via a Cloudflare quick
// tunnel. NOTE: quick tunnels (trycloudflare.com) generate a NEW random URL
// every time `cloudflared tunnel --url ...` is restarted - update this line
// again whenever the tunnel is restarted, or set up a named/persistent
// Cloudflare tunnel later for a stable URL.
const SERVER_URL = 'https://natural-supports-connecticut-soldiers.trycloudflare.com';

const state = { templates: [] };

function apiUrl(path) {
  return SERVER_URL.replace(/\/+$/, '') + path;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderBotHtml(text) {
  const parts = text.split(/```(?:lua)?\n?([\s\S]*?)```/g);
  let html = '';
  parts.forEach((part, i) => {
    if (i % 2 === 1) html += '<pre><code>' + escapeHtml(part) + '</code></pre>';
    else if (part.trim()) html += '<div>' + escapeHtml(part) + '</div>';
  });
  return html || escapeHtml(text);
}

function hideEmptyState() {
  const el = document.getElementById('emptyState');
  if (el) el.remove();
}

function clearChat() {
  const scroll = document.getElementById('chatScroll');
  scroll.innerHTML = '<div class="empty-state" id="emptyState"><span class="name">Enes AI</span>Ask for a system, a Lua concept, or describe something custom - e.g. "admin system", "how do coroutines work", "build a castle".</div>';
}

function openDetails() {
  document.getElementById('detailsPanel').classList.add('open');
  loadHealth();
  loadTemplates();
}
function closeDetails() {
  document.getElementById('detailsPanel').classList.remove('open');
}

async function loadHealth() {
  try {
    const res = await fetch(apiUrl('/api/health'));
    const data = await res.json();
    document.getElementById('statusDot').className = 'dot' + (data.ok ? '' : ' dead');
    document.getElementById('statServer').textContent = data.ok ? 'Online' : 'Error';
    document.getElementById('statStudios').textContent = data.studios_connected ?? 0;
    document.getElementById('statTemplates').textContent = data.templates ?? '-';
    document.getElementById('statKnowledge').textContent = data.knowledge_base ?? '-';
    document.getElementById('statLocalModel').textContent = data.local_model_loaded ? (data.local_model_status || 'loaded') : 'not configured';
  } catch (e) {
    document.getElementById('statusDot').className = 'dot dead';
    document.getElementById('statServer').textContent = 'Unreachable';
  }
}

async function loadTemplates() {
  try {
    const res = await fetch(apiUrl('/api/templates'));
    const data = await res.json();
    state.templates = data.templates || [];
    document.getElementById('templateChips').innerHTML =
      state.templates.map(function(t) { return '<span class="name-chip">' + t + '</span>'; }).join('') || 'none';
  } catch (e) {
    document.getElementById('templateChips').textContent = 'could not load';
  }
}

function addUserBubble(text) {
  hideEmptyState();
  const scroll = document.getElementById('chatScroll');
  scroll.insertAdjacentHTML('beforeend',
    '<div class="row user"><div class="bubble">' + escapeHtml(text) + '</div></div>');
  scroll.scrollTop = scroll.scrollHeight;
}

function addAssistantBubble(html, metaHtml) {
  const scroll = document.getElementById('chatScroll');
  scroll.insertAdjacentHTML('beforeend',
    '<div class="row assistant"><div class="bubble">' + html + '</div>' +
    (metaHtml ? '<div class="meta-line">' + metaHtml + '</div>' : '') + '</div>');
  scroll.scrollTop = scroll.scrollHeight;
}

function addErrorCard(message) {
  const scroll = document.getElementById('chatScroll');
  const id = 'err' + Date.now();
  scroll.insertAdjacentHTML('beforeend',
    '<div class="error-card" id="' + id + '"><span>&#9888; ' + escapeHtml(message) + '</span>' +
    '<button class="retry-btn" onclick="document.getElementById(\'' + id + '\').remove()">Dismiss</button></div>');
  scroll.scrollTop = scroll.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const msg = input.value.trim();
  if (!msg) return;

  addUserBubble(msg);
  input.value = '';
  btn.disabled = true;

  const startedAt = performance.now();
  try {
    const res = await fetch(apiUrl('/api/chat'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, studio_token: 'dashboard-test' })
    });
    const data = await res.json();
    const elapsedSec = ((performance.now() - startedAt) / 1000).toFixed(1);
    const text = data.response || '(no response)';
    const wordCount = text.trim().split(/\s+/).length;
    const meta = '<span class="meta-tag">~' + wordCount + ' words</span><span class="meta-tag">' + elapsedSec + 's</span>';
    addAssistantBubble(renderBotHtml(text), meta);
  } catch (e) {
    addErrorCard('Server unavailable - not running or unreachable.');
  }
  btn.disabled = false;
}

loadHealth();
setInterval(loadHealth, 10000);
</script>

</body>
</html>
